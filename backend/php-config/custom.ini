; Tools DKV — PHP Runtime Configuration for FrankenPHP (Railway)
; Applied via Dockerfile COPY to /usr/local/etc/php/conf.d/custom.ini

; Upload limits — support PDF files up to 250 MB
upload_max_filesize = 250M
post_max_size = 260M

; Execution limits — pdftoppm may take several minutes for large/complex PDFs
max_execution_time = 900
max_input_time = 900

; Memory — matches Railway container RAM (1 GB). pdftoppm is an external
; process and does NOT consume this limit; this only governs PHP itself.
memory_limit = 1024M
